name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-agent:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Agent
        run: dotnet restore .\src\ClipRemote.Agent\ClipRemote.Agent.csproj

      - name: Build Agent
        run: dotnet build .\src\ClipRemote.Agent\ClipRemote.Agent.csproj --configuration Release --no-restore

      - name: Publish portable Surface build
        run: dotnet publish .\src\ClipRemote.Agent\ClipRemote.Agent.csproj -c Release -r win-x64 --self-contained true -o .\artifacts\ClipRemote.Agent

      - name: Upload Windows Agent
        uses: actions/upload-artifact@v4
        with:
          name: ClipRemote-Agent-win-x64
          path: .\artifacts\ClipRemote.Agent
          if-no-files-found: error

  android-apk:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        shell: pwsh
        run: dotnet workload install android

      - name: Restore Android ARM64 app
        run: dotnet restore .\src\ClipRemote.Mobile\ClipRemote.Mobile.csproj -r android-arm64

      - name: Build installable ARM64 APK
        run: dotnet build .\src\ClipRemote.Mobile\ClipRemote.Mobile.csproj -c Debug -f net10.0-android -r android-arm64 --no-restore -p:AndroidPackageFormat=apk

      - name: Collect APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\artifacts\ClipRemote.Mobile | Out-Null
          $apk = Get-ChildItem .\src\ClipRemote.Mobile\bin\Debug\net10.0-android\android-arm64 -Recurse -Filter '*-Signed.apk' | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem .\src\ClipRemote.Mobile\bin\Debug\net10.0-android\android-arm64 -Recurse -Filter '*.apk' | Select-Object -First 1
          }
          if (-not $apk) {
            throw 'No se generó ningún APK ARM64.'
          }
          Copy-Item $apk.FullName .\artifacts\ClipRemote.Mobile\ClipRemote-Mobile-arm64.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipRemote-Mobile-ARM64-APK
          path: .\artifacts\ClipRemote.Mobile\ClipRemote-Mobile-arm64.apk
          if-no-files-found: error
